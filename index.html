/* ---- AI flows ---- */
async function runExtract(content, source){
  const raw = await claude(content, { system: EXTRACT_SYS, prefill:'{', max_tokens:4000 });
  const out = parseLoose(raw);
  const list = (out.items||[]).map(x => Object.assign({}, x, { source }));
  if(!list.length) throw new Error('Nothing travel-related found in that. Try a clearer photo, or add it manually.');
  return { list, kind: out.kind === 'program' ? 'program' : 'document', programDate: out.programDate || '' };
}
function ctxBlock(){
  const ctx = tripContext();
  return 'TRIP CONTEXT (for resolving dates and places):\n' + JSON.stringify(ctx);
}

/* Programmes come back as a selectable list, nothing selected by default;
   single documents keep the old behaviour (everything selected). */
function applyCandDefaults(list, kind, pdate){
  return list.map(c => {
    if(kind==='program' && !c.start && c.timeOnly && pdate) c.start = pdate+'T'+c.timeOnly;
    c.sel = (kind !== 'program');
    return c;
  });
}
async function doReadPhotos(btn){
  const orig = btn.innerHTML;
  try {
    const content = [{ type:'text', text: ctxBlock() + '\n\nExtract every itinerary item you can see in the following image(s). If the images are a printed schedule/programme, set kind "program".' }];
    PENDING.forEach(p => content.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data: p.full.split(',')[1] } }));
    btn.innerHTML = `<span class="spin"></span> Reading…`; btn.disabled = true;
    const r = await runExtract(content, 'photo');
    const photo = PENDING[0] ? PENDING[0].thumb : '';
    r.list.forEach((it, ix) => { if(photo && (r.kind==='program' || ix===0)) it.photo = photo; });  // keep the source photo on the items
    CAND_KIND = r.kind; CAND_PDATE = r.programDate;
    CANDIDATES = applyCandDefaults(r.list, r.kind, r.programDate);
    PENDING = []; render(); reviewSheet();
  } catch(e){ toast(e.message, true, 6500); btn.innerHTML = orig; btn.disabled = false; }
}
async function doReadText(btn){
  const txt = ($('#blob')||{}).value || '';
  if(!txt.trim()){ toast('Paste something first', true); return; }
  const orig = btn.innerHTML;
  try {
    btn.innerHTML = `<span class="spin"></span> Sorting…`; btn.disabled = true;
    const r = await runExtract(ctxBlock() + '\n\nExtract every itinerary item from this text:\n\n' + txt, 'text');
    CAND_KIND = r.kind; CAND_PDATE = r.programDate;
    CANDIDATES = applyCandDefaults(r.list, r.kind, r.programDate);
    reviewSheet();
  } catch(e){ toast(e.message, true, 6500); }
  btn.innerHTML = orig; btn.disabled = false;
}
async function doSuggestCat(btn){
  const v = readManual();
  if(!v.title.trim()){ toast('Write a title first', true); return; }
  const orig = btn.innerHTML;
  try {
    btn.innerHTML = `<span class="spin"></span> Thinking…`; btn.disabled = true;
    const list = await runExtract(ctxBlock() + '\n\nTidy this single manually-typed entry into exactly one item. Keep the user’s wording where sensible.\n\n' + JSON.stringify(v), 'manual');
    const c = list[0];
    const set = (id,val) => { const el = $('#'+id); if(el && val) el.value = val; };
    set('m_title', c.title); set('m_cat', CATS[c.category]?c.category:null);
    set('m_start', c.start); set('m_end', c.end); set('m_loc', c.location);
    set('m_conf', c.confirmation); set('m_det', c.details);
    if(c.remindMinutes) set('m_rem', String(c.remindMinutes));
    if($('#m_crit')) $('#m_crit').checked = !!c.critical;
    if($('#m_aa')) $('#m_aa').checked = !!c.allAboard;
    toast('Filed as '+(CATS[c.category]?CATS[c.category].l:'Note'));
  } catch(e){ toast(e.message, true, 6000); }
  btn.innerHTML = orig; btn.disabled = false;
}
async function doRecs(btn){
  const t = trip(), sh = $('#sheet') || document;
  const focus = ($('#focus')||{}).value || '';
  const aa = nextAllAboard();
  const now = new Date();
  const upcoming = items().filter(i => { const d = toDate(i.start); return !d || d > new Date(now-86400000); })
    .sort(sortItems).slice(0,40)
    .map(i => ({ category:i.category, title:i.title, start:i.start||null, location:i.location||'' }));
  const payload = {
    today: todayStr(), nowLocal: localNowStr(),
    trip: { name:t.name, destination:t.destination||'', dates:[t.startDate||'',t.endDate||''], ship:t.ship||'', notes:t.notes||'' },
    hardDeadline: aa ? { what:aa.title, whenLocal:aa.start, where:aa.location||'', minutesFromNow: Math.round((toDate(aa.start)-now)/60000) } : null,
    itineraryAlreadyPlanned: upcoming,
    preferences: focus || 'none stated'
  };
  const orig = btn.innerHTML;
  try {
    btn.innerHTML = `<span class="spin"></span> Asking Claude…`; btn.disabled = true;
    const raw = await claude('Recommend what this traveller should do next.\n\n' + JSON.stringify(payload,null,1),
      { system: REC_SYS, prefill:'{"items":', max_tokens:4000 });
    const out = parseLoose(raw);
    const list = (out.items||[]).filter(r => r && r.title);
    if(!list.length) throw new Error('No suggestions came back — try adding a destination to the trip.');
    S.recs[t.id] = { when:'updated '+fmtT(localNowStr()), items:list, focus };
    save(); render();
  } catch(e){ toast(e.message, true, 6500); btn.innerHTML = orig; btn.disabled = false; }
}
async function doAutofillTrip(btn){
  const blob = ($('#t_blob')||{}).value || '';
  if(!blob.trim()){ toast('Paste or describe the trip first', true); return; }
  const orig = btn.innerHTML;
  try {
    btn.innerHTML = `<span class="spin"></span> Reading…`; btn.disabled = true;
    const sys = EXTRACT_SYS + `\n\nADDITIONAL TASK: also identify the trip itself. Return {"trip":{"name":"","destination":"","startDate":"YYYY-MM-DD","endDate":"YYYY-MM-DD","ship":"","notes":""},"items":[...]} using the same item rules. Leave trip fields as "" when the source does not say. "name" should be short and human, e.g. "Adriatic cruise".`;
    const raw = await claude(`Today is ${todayStr()}. Set up a trip from this:\n\n${blob}`, { system: sys, prefill:'{"trip":', max_tokens:4000 });
    const out = parseLoose(raw);
    const tp = out.trip || {};
    const set = (id,v) => { const el = $('#'+id); if(el && v) el.value = v; };
    set('t_name', tp.name); set('t_dest', tp.destination); set('t_s', tp.startDate);
    set('t_e', tp.endDate); set('t_ship', tp.ship); set('t_notes', tp.notes);
    PARSED_TRIP_ITEMS = (out.items||[]).map(x => Object.assign({}, x, { source:'text' }));
    toast(PARSED_TRIP_ITEMS.length ? `Filled in — plus ${PARSED_TRIP_ITEMS.length} item${PARSED_TRIP_ITEMS.length===1?'':'s'} ready to save` : 'Trip details filled in');
  } catch(e){ toast(e.message, true, 6500); }
  btn.innerHTML = orig; btn.disabled = false;
}
let PARSED_TRIP_ITEMS = [];

/* ---- reminders ---- */
function tick(){
  const hero = $('#hero');
  if(hero && hero.dataset.target){
    const ms = toDate(hero.dataset.target) - new Date();
    const big = $('#cd-big');
    if(big) big.textContent = ms > 0 ? dur(ms) : 'now';
    if(hero.dataset.kind === 'aboard'){
      hero.classList.toggle('bad', ms < 45*60000);
      hero.classList.toggle('warn', ms >= 45*60000 && ms < 120*60000);
    }
  }
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  S.trips.forEach(t => t.items.forEach(i => {
    if(i.done || !i.remindMinutes || !i.start) return;
    const d = toDate(i.start); if(!d) return;
    const fire = d.getTime() - i.remindMinutes*60000;
    if(now >= fire && now < d.getTime() + 60000 && S.notified.indexOf(i.id) < 0){
      S.notified.push(i.id); save();
      try { new Notification((CATS[i.category]?CATS[i.category].e+' ':'')+i.title, {
        body: (i.allAboard?'BACK ON BOARD ':'') + (fmtT(i.start)||'') + (i.location?' · '+i.location:''), tag:i.id }); } catch(e){}
    }
  }));
}

/* ---- theme ---- */
function applyTheme(){
  const want = S.theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : S.theme;
  document.documentElement.setAttribute('data-theme', want);
  const m = $('meta[name="theme-color"]'); if(m) m.setAttribute('content', want === 'light' ? '#f5f7fa' : '#0e1116');
}

/* ============================================================
   wiring
   ============================================================ */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id;

  if(a === 'close-sheet'){ closeSheet(); return; }
  if(a === 'tab'){ TAB = el.dataset.tab; SEARCH=''; render(); window.scrollTo(0,0); return; }
  if(a === 'addmode'){ ADDMODE = el.dataset.m; render(); return; }
  if(a === 'filter'){ FILTER = el.dataset.c; render(); return; }
  if(a === 'open'){ openItem(id); return; }

  if(a === 'rmphoto'){ PENDING.splice(+el.dataset.ix,1); render(); return; }
  if(a === 'read-photos'){ await doReadPhotos(el); return; }
  if(a === 'read-text'){ await doReadText(el); return; }
  if(a === 'suggest-cat'){ await doSuggestCat(el); return; }
  if(a === 'attach-manual'){ ADDMODE = 'manual'; render(); return; }

  if(a === 'rmcand'){ syncCands(); CANDIDATES.splice(+el.dataset.ix,1); if(!CANDIDATES.length){ closeSheet(); return; } reviewSheet(); return; }
  if(a === 'cand-sel'){ syncCands(); const c = CANDIDATES[+el.dataset.ix]; if(c) c.sel = !c.sel; reviewSheet(); return; }
  if(a === 'cand-all'){ syncCands(); CANDIDATES.forEach(c => c.sel = true); reviewSheet(); return; }
  if(a === 'cand-none'){ syncCands(); CANDIDATES.forEach(c => c.sel = false); reviewSheet(); return; }
  if(a === 'apply-progdate'){
    syncCands();
    const d = ($('#prog_date')||{}).value || '';
    if(!d){ toast('Pick a date first', true); return; }
    CAND_PDATE = d;
    CANDIDATES.forEach(c => { if(!c.start && c.timeOnly) c.start = d+'T'+c.timeOnly; });
    reviewSheet(); return;
  }
  if(a === 'commit-cands'){
    syncCands();
    const chosen = CANDIDATES.filter(c => c.sel);
    if(!chosen.length){ toast('Nothing selected', true); return; }
    const n = addItems(chosen); CANDIDATES = []; CAND_KIND = 'document'; CAND_PDATE = ''; closeSheet();
    toast(n+' item'+(n===1?'':'s')+' filed'+(lastSkipped?` · ${lastSkipped} already there`:''), false, 3600);
    TAB = 'timeline'; render(); return;
  }

  if(a === 'save-manual'){
    const v = readManual();
    if(!v.title.trim()){ toast('Give it a title', true); return; }
    if(id === undefined && el.dataset.edit){
      const it = items().find(x => x.id === el.dataset.edit);
      if(it){ Object.assign(it, v); if(it.category === 'activity'){ it.requirements = null; enqueueRequirements([it.id]); } save(); closeSheet(); toast('Updated'); TAB='timeline'; render(); return; }
    }
    v.source = v.photo ? 'photo' : 'manual';
    const tb = trip(); const before = tb ? new Set(tb.items.map(x => x.id)) : new Set();
    addItems([v]); PENDING = [];
    if(v.category === 'activity'){ const ta = trip(); enqueueRequirements(ta ? ta.items.filter(x => !before.has(x.id)).map(x => x.id) : []); }
    closeSheet(); toast('Saved'); TAB = 'timeline'; render(); return;
  }
  if(a === 'edit-item'){
    const it = items().find(x => x.id === id); if(!it) return;
    sheet('Edit item', manualForm(it, it.id)); return;
  }
  if(a === 'del-item'){
    const t = trip(); t.items = t.items.filter(x => x.id !== id); save(); closeSheet(); toast('Deleted'); render(); return;
  }
  if(a === 'toggle-done'){
    const it = items().find(x => x.id === id); if(it){ it.done = !it.done; save(); closeSheet(); render(); } return;
  }
  if(a === 'ics-one'){ const it = items().find(x => x.id === id); if(it) downloadICS([it], (it.title||'item').replace(/\W+/g,'-').slice(0,40)); return; }
  if(a === 'export-ics'){ const t = trip(); if(t) downloadICS(t.items, (t.name||'trip').replace(/\W+/g,'-').slice(0,40)); return; }

  if(a === 'new-trip'){ PARSED_TRIP_ITEMS = []; tripSheet(null); return; }
  if(a === 'edit-trip'){ tripSheet(S.trips.find(t => t.id === id)); return; }
  if(a === 'use-trip'){ S.activeTrip = id; save(); TAB = 'now'; render(); return; }
  if(a === 'del-trip'){
    const t = S.trips.find(x => x.id === id); if(!t) return;
    if(!confirm(`Delete "${t.name}" and its ${t.items.length} items? This cannot be undone.`)) return;
    S.trips = S.trips.filter(x => x.id !== id); delete S.recs[id];
    if(S.activeTrip === id) S.activeTrip = S.trips[0] ? S.trips[0].id : null;
    save(); render(); toast('Trip deleted'); return;
  }
  if(a === 'autofill-trip'){ await doAutofillTrip(el); return; }
  if(a === 'save-trip'){
    const g = i => { const e = $('#'+i); return e ? e.value.trim() : ''; };
    const name = g('t_name') || g('t_dest') || 'My trip';
    if(id){
      const t = S.trips.find(x => x.id === id);
      Object.assign(t, { name, destination:g('t_dest'), startDate:g('t_s'), endDate:g('t_e'), ship:g('t_ship'), notes:g('t_notes') });
    } else {
      const t = { id:uid(), name, destination:g('t_dest'), startDate:g('t_s'), endDate:g('t_e'), ship:g('t_ship'), notes:g('t_notes'),
                  items:[], people:[], bags:[], lists:[], refs:[], suggestions:[], departureAt:'', createdAt:Date.now() };
      seedTripDefaults(t);
      S.trips.push(t); S.activeTrip = t.id;
      if(PARSED_TRIP_ITEMS.length){ addItems(PARSED_TRIP_ITEMS); PARSED_TRIP_ITEMS = []; }
      t.departureAt = deriveDeparture(t);
    }
    save(); closeSheet(); TAB = 'now'; render(); toast('Trip saved'); return;
  }

  if(a === 'get-recs'){ await doRecs(el); return; }
  if(a === 'add-rec'){
    const t = trip(), r = (S.recs[t.id].items||[])[+el.dataset.ix]; if(!r) return;
    addItems([{ category: CATS[r.category]?r.category:'activity', title:r.title, start:r.start||'',
      location:r.location||'', details:[r.why,r.bestTime&&('Best time: '+r.bestTime),r.cost&&('Cost: '+r.cost),r.duration&&('Takes: '+r.duration),r.tip&&('Tip: '+r.tip)].filter(Boolean).join('\n'),
      source:'ai' }]);
    toast('Added to your trip'); return;
  }

  // ---- lists ----
  if(a === 'new-list'){ listSheet(null); return; }
  if(a === 'open-list'){ CURRENT_LIST = id; TAB = 'list'; render(); window.scrollTo(0,0); return; }
  if(a === 'edit-list'){ listSheet(findList(id)); return; }
  if(a === 'save-list'){
    const t = trip(); if(!t) return;
    const g = i => { const e = $('#'+i); return e ? e.value.trim() : ''; };
    const title = g('l_title') || 'Untitled list';
    const leadEl = $('#l_lead');
    const leadMin = (leadEl && leadEl.value !== '') ? Math.max(0, +leadEl.value) * 60 : null;
    if(id){ const l = findList(id); if(l){ l.title = title; l.due = g('l_due'); l.leadMinutes = leadMin; } }
    else {
      const kindEl = $('#l_kind');
      const l = { id:uid(), kind:(kindEl?kindEl.value:'checklist'), title, due:g('l_due'), leadMinutes:leadMin,
                  forActivityId:'', archived:false, createdAt:Date.now(), entries:[] };
      if(l.kind==='packing' && $('#l_base') && $('#l_base').checked)
        l.entries = (S.baseList||[]).map(txt => ({ id:uid(), text:txt, done:false, qty:null, bagId:'', personId:'', where:'', price:null, currency:'', requiredFor:[], source:'derived', reason:'from your usual list', note:'' }));
      t.lists.push(l); CURRENT_LIST = l.id;
    }
    save(); closeSheet(); TAB = id ? TAB : 'list'; render(); toast(id?'List updated':'List created'); return;
  }
  if(a === 'del-list'){
    const t = trip(); if(!t) return;
    if(!confirm('Delete this list and its items?')) return;
    t.lists = t.lists.filter(l => l.id !== id); CURRENT_LIST = null;
    save(); TAB = 'lists'; render(); toast('List deleted'); return;
  }
  if(a === 'archive-list'){ const l = findList(id); if(l){ l.archived = !l.archived; save(); TAB = 'lists'; render(); toast(l.archived?'Archived':'Restored'); } return; }

  // ---- entries ----
  if(a === 'tick-entry'){
    const l = findList(el.dataset.list); if(!l) return;
    const e = (l.entries||[]).find(x => x.id === el.dataset.entry);
    if(e){ e.done = !e.done; save(); render(); } return;
  }
  if(a === 'add-entry'){
    const l = findList(id); if(!l) return;
    const inp = $('#ent_new'); const text = inp ? inp.value.trim() : '';
    if(!text){ toast('Type an item first', true); return; }
    l.entries.push({ id:uid(), text:text.slice(0,140), done:false, qty:null, bagId:'', personId:'',
      where: l.kind==='shopping' ? 'home' : '', price:null, currency:'', requiredFor:[], source:'manual', reason:'', note:'' });
    save(); render(); const n = $('#ent_new'); if(n) n.focus(); return;
  }
  if(a === 'edit-entry'){ const l = findList(el.dataset.list); if(!l) return; entrySheet(l, (l.entries||[]).find(x => x.id === el.dataset.entry)); return; }
  if(a === 'save-entry'){
    const l = findList(el.dataset.list); if(!l) return;
    const g = i => { const x = $('#'+i); return x ? x.value.trim() : ''; };
    const data = { text:g('e_text').slice(0,140), qty:g('e_qty')?+g('e_qty'):null, note:g('e_note') };
    if(l.kind==='packing') data.bagId = ($('#e_bag')||{}).value || '';
    if(l.kind==='shopping'){ data.where = ($('#e_where')||{}).value || 'home'; data.price = g('e_price')?+g('e_price'):null; data.currency = g('e_cur'); }
    if(!data.text){ toast('Give it a name', true); return; }
    const eid = el.dataset.entry;
    if(eid){ const e = (l.entries||[]).find(x => x.id === eid); if(e) Object.assign(e, data); }
    else l.entries.push(Object.assign({ id:uid(), done:false, qty:null, bagId:'', personId:'',
      where: l.kind==='shopping' ? 'home' : '', price:null, currency:'', requiredFor:[], source:'manual', reason:'', note:'' }, data));
    save(); closeSheet(); render(); return;
  }
  if(a === 'del-entry'){ const l = findList(el.dataset.list); if(!l) return; l.entries = (l.entries||[]).filter(x => x.id !== el.dataset.entry); save(); closeSheet(); render(); return; }

  // ---- refs vault ----
  if(a === 'new-ref'){ refSheet(null); return; }
  if(a === 'edit-ref'){ refSheet(refs().find(r => r.id === id)); return; }
  if(a === 'save-ref'){
    const t = trip(); if(!t) return;
    const g = i => { const x = $('#'+i); return x ? x.value.trim() : ''; };
    const data = { label:g('r_label'), value:g('r_value'), category:($('#r_cat')||{}).value || 'other',
      expires:g('r_exp'), masked: !!($('#r_mask') && $('#r_mask').checked), note:g('r_note') };
    if(!data.value){ toast('Add a value', true); return; }
    if(id){ const r = refs().find(x => x.id === id); if(r) Object.assign(r, data); }
    else t.refs.push(Object.assign({ id:uid(), relatedItemId:'' }, data));
    save(); closeSheet(); render(); toast('Saved to vault'); return;
  }
  if(a === 'del-ref'){ const t = trip(); if(!t) return; t.refs = t.refs.filter(r => r.id !== id); save(); closeSheet(); render(); toast('Removed'); return; }
  if(a === 'reveal-ref'){ REVEALED.add(id); render(); return; }
  if(a === 'copy-ref'){
    const r = refs().find(x => x.id === id); if(!r) return;
    try {
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.value||'').then(()=>toast('Copied'), ()=>fallbackCopy(r.value||''));
      else fallbackCopy(r.value||'');
    } catch(e){ fallbackCopy(r.value||''); }
    if(r.masked){ REVEALED.add(id); render(); }
    return;
  }

  // ---- suggestions & requirements ----
  if(a === 'accept-sugg'){
    const t = trip(); if(!t) return;
    const s = pendingSuggestions(t).find(x => x.id === id); if(!s) return;
    applySuggestion(t, s);
    (t.suggestions||[]).forEach(x => { if(x.id === id) x.status = 'accepted'; });
    save(); render(); toast(s.kind==='buy-there' ? 'Added to shopping' : 'Added to packing'); return;
  }
  if(a === 'dismiss-sugg'){
    const t = trip(); if(!t) return;
    const s = pendingSuggestions(t).find(x => x.id === id); if(!s) return;
    const key = normText((s.payload && s.payload.text) || s.title);
    if(key && S.neverSuggest.indexOf(key) < 0) S.neverSuggest.push(key);   // sticky, global
    (t.suggestions||[]).forEach(x => { if(x.id === id) x.status = 'dismissed'; });
    save(); render(); return;
  }
  if(a === 'plan-item'){
    const found = findItemAny(id); if(!found) return;
    found.it.requirements = null; closeSheet();
    if(hasKey()){ enqueueRequirements([id]); toast('Planning what to pack…'); } else toast('Add a Claude API key first', true);
    return;
  }
  if(a === 'check-list'){ await doCheckList(el, id); return; }
  if(a === 'learn-list'){
    const l = findList(id); if(!l || l.kind !== 'packing') return;
    const neverTicked = new Set((l.entries||[]).filter(e => !e.done).map(e => normText(e.text)));
    const seen = new Set(), out = [];
    const add = txt => { const k = normText(txt); if(k && !seen.has(k)){ seen.add(k); out.push(txt); } };
    (S.baseList||[]).forEach(txt => { if(!neverTicked.has(normText(txt))) add(txt); });   // keep base unless never used this trip
    (l.entries||[]).filter(e => e.done).forEach(e => add(e.text.replace(/ — .*$/,'')));    // add what you ticked (strip daypack annotation)
    S.baseList = out;
    save(); render(); toast('Your usual list now has '+out.length+' item'+(out.length===1?'':'s')); return;
  }

  if(a === 'theme'){ S.theme = el.dataset.v; save(); applyTheme(); render(); return; }
  if(a === 'save-settings'){
    S.apiKey = ($('#s_key')||{}).value.trim(); S.model = ($('#s_model')||{}).value;
    S.endpoint = ($('#s_ep')||{}).value.trim(); save(); render(); toast('Settings saved'); return;
  }
  if(a === 'test-key'){
    S.apiKey = ($('#s_key')||{}).value.trim(); S.model = ($('#s_model')||{}).value; S.endpoint = ($('#s_ep')||{}).value.trim(); save();
    const orig = el.innerHTML; el.innerHTML = `<span class="spin"></span>`; el.disabled = true;
    try { await claude('Reply with the single word: ready', { max_tokens:12 }); toast('✓ Connected'); }
    catch(e){ toast(e.message, true, 7000); }
    el.innerHTML = orig; el.disabled = false; return;
  }
  if(a === 'ask-notif'){
    if(!('Notification' in window)){ toast('This browser has no notifications', true); return; }
    try { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Alerts on (while the app is open)' : 'Alerts not allowed', p !== 'granted'); render(); } catch(e){}
    return;
  }
  if(a === 'export'){
    dl(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), 'travelagent-backup-'+todayStr()+'.json');
    toast('Backup saved'); return;
  }
  if(a === 'wipe'){
    if(!confirm('Delete all trips, items and settings from this device?')) return;
    store.del(KEY); S = { v:2, apiKey:'', model:'claude-opus-5', endpoint:'', theme:'auto', activeTrip:null, trips:[], notified:[], recs:{}, neverSuggest:[], baseList:[] };
    save(); TAB = 'now'; render(); toast('All data deleted'); return;
  }
});

document.addEventListener('change', async (ev) => {
  const el = ev.target;
  if(el.id === 'tripsel'){ S.activeTrip = el.value; save(); render(); return; }
  if(el.id === 'pick' && el.files && el.files.length){
    const files = Array.from(el.files).slice(0,6); el.value = '';
    toast('Preparing '+files.length+' photo'+(files.length===1?'':'s')+'…');
    for(const f of files){
      try { const img = await fileToImg(f); PENDING.push({ thumb: shrink(img,560,.55), full: shrink(img,1500,.78) }); }
      catch(e){ toast(e.message, true); }
    }
    render(); return;
  }
  if(el.id === 'imp' && el.files && el.files[0]){
    const f = el.files[0]; el.value = '';
    try {
      const txt = await f.text(); const p = JSON.parse(txt);
      if(!p || !Array.isArray(p.trips)) throw new Error('That file is not a Travel Agent backup');
      if(!confirm('Replace everything on this device with the backup?')) return;
      S = Object.assign({ v:2, apiKey:'', model:'claude-opus-5', endpoint:'', theme:'auto', activeTrip:null, trips:[], notified:[], recs:{}, neverSuggest:[], baseList:[] }, p);
      load(); save(); applyTheme(); TAB = 'now'; render(); toast('Backup restored');
    } catch(e){ toast(e.message, true, 5000); }
  }
});
document.addEventListener('input', (ev) => {
  if(ev.target.id === 'q'){ SEARCH = ev.target.value; const p = ev.target.selectionStart; render(); const n = $('#q'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } }
  if(ev.target.id === 'ref_q'){ REFQ = ev.target.value; const p = ev.target.selectionStart; render(); const n = $('#ref_q'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } }
});

/* ---- boot ---- */
load(); applyTheme(); render();
setInterval(tick, 20000); tick();
if(window.matchMedia) try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch(e){}
document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#sheet')) closeSheet(); });

/* ---- offline support (hosted build only) ---- */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if(!w) return;
        w.addEventListener('statechange', () => {
          if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
    }).catch(()=>{});
  });
}
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  const d = document.createElement('div');
  d.id = 'updbar';
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:96px;z-index:130;background:var(--panel);border:1px solid var(--acc);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);font-size:13.5px';
  d.innerHTML = '<span style="flex:1">A newer version of Travel Agent is ready.</span>';
  const btn = document.createElement('button');
  btn.className = 'btn sm'; btn.textContent = 'Reload';
  btn.onclick = () => location.reload();
  d.appendChild(btn); document.body.appendChild(d);
}
</script>
</body>
</html>
